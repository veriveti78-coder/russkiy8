document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{fl=b.dataset.f;mark();draw()});document.querySelectorAll(".cs").forEach(b=>b.onclick=()=>{srt=b.dataset.s;mark();draw()});$("sq").oninput=e=>{qs=e.target.value.trim().toLowerCase();draw()};mark();draw()}
const back='<button class="btn o" onclick="home()">← В меню</button>';
const STP='<button class="btn o" id="stp" style="float:right">⏹ Завершить досрочно</button>';
const stp=f=>{const e=$("stp");if(e)e.onclick=f};
const res=h=>{app.innerHTML=`<div class="card">${h}<p>${back}</p></div>`};
function home(){clearInterval(window.tm);try{speechSynthesis.cancel()}catch(e){}
app.innerHTML=`<div class="card"><h2>Добро пожаловать!</h2>Выучено слов: <b>${learned()}</b> из ${N}. Слова идут от лёгких к сложным; главное — орфографический диктант.</div><div class="grid">
<div class="tile" onclick="mean()"><h3>📖 Значение слов</h3><p>Карточки: слово → смысл</p></div>
<div class="tile" onclick="spMenu()"><h3>✍️ Правописание</h3><p>Пропуски: одна или две буквы</p></div>
<div class="tile" onclick="dict()"><h3>📚 Словарь</h3><p>Все слова, значения, происхождение, ★</p></div>
<div class="tile" onclick="speed()"><h3>⚡ На скорость</h3><p>60 секунд, весь словарь по кругу</p></div>
<div class="tile" onclick="topics()"><h3>📏 Правила и пунктуация</h3><p>${T.length} тем по учебнику</p></div>
<div class="tile" onclick="exams()"><h3>🎓 Экзамены</h3><p>Бесконечные уровни</p></div>
<div class="tile" onclick="ach()"><h3>🏆 Успехи</h3><p>${Object.keys(S.a).length} из ${AC.length} ачивок</p></div>
<div class="tile" onclick="spell('err')"><h3>🔁 Работа над ошибками</h3><p>Слов в списке: ${S.m.length}</p></div></div>`}
function mean(){const q=prio(L.filter(w=>(S.w[w]||0)<2||S.f[w]));if(!q.length)return res("Все слова выучены! 🎉");let i=0,k=0;
const end=()=>res(`<h2>Занятие завершено</h2>Отмечено «Знаю»: <b>${k}</b> · просмотрено карточек: ${i}`);
(function show(){const w=q[i%q.length];app.innerHTML=`<div class="card">${STP}<span class="tag">${LN[LV[w]]}</span><div class="big">${w}</div><div id="d" class="m" style="text-align:center">Вспомните значение, затем проверьте.</div><p style="text-align:center"><button class="btn" id="sb">Показать значение</button><button class="btn o" id="fv">${star(w)} Важное</button></p></div>`;stp(end);$("fv").onclick=()=>{tog(w);$("fv").textContent=star(w)+" Важное"};
$("sb").onclick=()=>{$("d").innerHTML=`<b style="color:var(--t)">${MN[w]||"значение уточните в словаре"}</b>`;$("sb").outerHTML=`<button class="btn" id="k">Знаю ✓</button><button class="btn o" id="n">Повторить</button>`;
$("k").onclick=()=>{S.w[w]=(S.w[w]||0)+1;k++;xp(5);save();i++;show()};$("n").onclick=()=>{i++;show()}}})()}
function spMenu(){app.innerHTML=`<div class="card"><h2>Правописание</h2><p>Впишите пропущенное. Ошибка подсвечивается сразу. Особое внимание — одной или двум буквам (например «с» или «сс»). Если непонятно, что за слово, нажмите «Значение».</p>${[1,2,3,0].map(l=>`<button class="btn" onclick="spell(${l})">${l?LN[l]:"Все"}</button>`).join("")}</div>${back}`}
function spell(f){let q=f==="err"?L.filter(w=>S.m.includes(w)):f?L.filter(w=>LV[w]==f):[...L];if(f!=="err")q=q.filter(w=>(S.w[w]||0)<2||S.f[w]);q.filter(w=>S.f[w]).forEach(w=>q.splice(Math.min(q.length,q.indexOf(w)+4+Math.floor(Math.random()*6)),0,w));
if(!q.length)return res("В этой категории всё выучено или ошибок нет 🎉");let i=0,run=0,good=0,bad=0;
const end=()=>res(`<h2>${i>=q.length?"Список пройден!":"Занятие завершено досрочно"}</h2>Верно: <b class="ok">${good}</b> · ошибок: <b class="er">${bad}</b>`);
(function show(){if(i>=q.length)return end();const w=q[i],g=gap(w);
const rule=g.d==2?`В этом слове пишется двойная согласная «${g.a}».`:g.d==1?`В этом слове — одна согласная «${g.a}», не удваивается.`:`Проверьте по словарю: пишется «${g.a}».`;
app.innerHTML=`<div class="card">${STP}<span class="tag">${LN[LV[w]]}</span> <span class="tag">${i+1}/${q.length}</span><div class="big" id="bw">${g.pre}<span class="gp">&nbsp;?&nbsp;</span>${g.post}</div><p class="m" style="text-align:center">${g.d?"Одна или две буквы? Впишите пропущенное.":"Впишите пропущенную букву."}</p><p style="text-align:center"><input id="in" autocomplete="off"> <button class="btn" id="ck">Проверить</button> <button class="btn o" id="mv">💡 Значение</button> <button class="btn o" id="fv">${star(w)} Важное</button></p><div id="mm" class="m" style="text-align:center"></div><div id="r" style="text-align:center"></div></div>`;stp(end);
const inp=$("in");inp.focus();let done=0,tmr;
$("mv").onclick=()=>{$("mm").innerHTML="<i>"+(MN[w]||"значение уточните в словаре")+"</i>"};$("fv").onclick=()=>{tog(w);$("fv").textContent=star(w)+" Важное"};
const fix=ok=>{if(done)return;done=1;clearTimeout(tmr);inp.disabled=1;$("bw").innerHTML=`${g.pre}<span class="gp ${ok?"ok pop":"er shake"}">${g.a}</span>${g.post}`;
if(ok){S.w[w]=(S.w[w]||0)+1;S.m=S.m.filter(x=>x!=w);xp(10);run++;good++;if(run%5==0)xp(10)}else{run=0;bad++;if(!S.m.includes(w))S.m.push(w);inp.classList.add("shake");inp.style.borderColor="var(--er)"}save();
$("r").innerHTML=`<p class="${ok?"ok":"er"}"><b>${ok?"Верно! ✓":"Ошибка! ✗"}</b> ${w}${ok?` · серия: ${run}`:""}</p>${ok?"":`<p>${rule}</p>`}<p class="m">${MN[w]||""}</p><button class="btn" id="nx">Далее</button>`;$("nx").focus();$("nx").onclick=()=>{i++;show()}};
const chk=()=>{const v=inp.value.trim().toLowerCase();if(v)fix(v==g.a)};
inp.oninput=()=>{if(done)return;clearTimeout(tmr);const v=inp.value.trim().toLowerCase();if(!v)return;if(!g.a.startsWith(v))return fix(false);if(v==g.a){g.d==1?tmr=setTimeout(()=>fix(true),700):fix(true)}};
$("ck").onclick=chk;inp.onkeydown=e=>{if(e.key=="Enter")chk()}})()}
function speed(){let q=wsh(L),i=0,sc=0,er=[],t=60,over=0;app.innerHTML=`<div class="card"><h2>⚡ На скорость</h2><p>60 секунд. Выбирайте верный вариант — слова идут по всему словарю без повторов.</p><button class="btn" id="go">Старт</button></div>${back}`;
$("go").onclick=()=>{window.tm=setInterval(()=>{t--;const e=$("tt");if(e)e.textContent=t;if(t<=0)fin()},1000);nx()};
function fin(){if(over)return;over=1;clearInterval(window.tm);S.best=Math.max(S.best,sc);xp(sc*3);er.forEach(w=>{if(!S.m.includes(w))S.m.push(w)});save();res(`<h2>${t<=0?"Время вышло!":"Раунд завершён"}</h2>Верно: <b class="ok">${sc}</b> · ошибок: <b class="er">${er.length}</b> · рекорд: ${S.best}${er.length?`<p>Ошибки (добавлены в «Работу над ошибками»):<br>${er.join(", ")}</p>`:""}<button class="btn" onclick="speed()">Ещё раз</button>`)}
function nx(){if(over)return;if(i>=q.length)return fin();const w=q[i],g=gap(w),o=sh(g.o);app.innerHTML=`<div class="card">${STP}<div class="m">⏱ <b id="tt">${t}</b> · верно: ${sc}</div><div class="big">${g.pre}<span class="gp">?</span>${g.post}</div><p style="text-align:center">${o.map(x=>`<button class="btn" style="font-size:26px;min-width:70px" data-x="${x}">${x}</button>`).join(" ")}</p></div>`;stp(fin);
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const ok=b.dataset.x==g.a;document.querySelectorAll("[data-x]").forEach(x=>{x.disabled=1;if(x.dataset.x==g.a)x.style.background="var(--ok)"});
if(ok){sc++;b.classList.add("pop")}else{er.push(w);b.style.background="var(--er)";b.classList.add("shake")}i++;setTimeout(nx,ok?350:900)})}}
function quiz(qs,ex,cb){let i=0,ok=0;const tot=qs.length;qs=sh(qs);(function s(){if(i>=tot)return cb(ok,i,tot,0);const [q,o,a]=qs[i];const idx=sh(o.map((_,k)=>k));
app.innerHTML=`<div class="card">${STP}<span class="tag">${i+1}/${tot}</span><p><b>${q}</b></p>${idx.map(k=>`<button class="btn o" style="display:block;width:100%;text-align:left" data-k="${k}">${o[k]}</button>`).join("")}<div id="r"></div></div>`;stp(()=>cb(ok,i,tot,1));
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const g=+b.dataset.k==a;if(g)ok++;document.querySelectorAll("[data-k]").forEach(x=>x.disabled=1);
if(ex){i++;s()}else{b.style.borderColor=g?"var(--ok)":"var(--er)";b.classList.add(g?"pop":"shake");$("r").innerHTML=`<p class="${g?"ok":"er"}">${g?"Верно!":"Ошибка! Правильно: "+o[a]}</p><button class="btn" id="nx">Далее</button>`;$("nx").onclick=()=>{i++;s()};if(g)xp(5);save()}})})()}
function topics(){app.innerHTML=`<div class="grid">${T.map(t=>`<div class="tile" onclick="topic('${t.id}')"><h3>${t.n}</h3><p>Экзамен: ур. ${S.ex[t.id]||0}</p></div>`).join("")}</div>${back}`}
function topic(id){const t=T.find(x=>x.id==id);app.innerHTML=`<div class="card"><h2>${t.n}</h2><p>${t.p}</p><button class="btn" id="pr">Практика</button><button class="btn o" onclick="topExam('${id}')">Экзамен (ур. ${(S.ex[id]||0)+1})</button></div><button class="btn o" onclick="topics()">← Темы</button> ${back}`;$("pr").onclick=()=>quiz(t.q,0,(o,a,n,e)=>res(`<h2>Практика ${e?"прервана":"завершена"}</h2>Верно: ${o} из ${a} ответов<br><button class="btn" onclick="topic('${id}')">К теме</button>`))}
function topExam(id){const t=T.find(x=>x.id==id),lv=(S.ex[id]||0)+1;quiz(t.q,1,(o,a,n,e)=>{const p=!e&&o/n>=.8;if(p){S.ex[id]=lv;xp(40*lv)}else xp(o*2);save();res(`<h2 class="${p?"ok":"er"}">${p?"Экзамен сдан! Уровень "+lv:e?"Экзамен прерван":"Не сдан"}</h2>Верно: ${o} из ${n} (нужно не менее 80%)<br><button class="btn" onclick="topExam('${id}')">${p?"Следующий уровень":"Пересдать"}</button>`)})}
function exams(){app.innerHTML=`<div class="grid"><div class="tile" onclick="spExam()"><h3>Орфографический диктант</h3><p>20 слов · уровень ${(S.ex.sp||0)+1}</p></div>${T.map(t=>`<div class="tile" onclick="topExam('${t.id}')"><h3>${t.n}</h3><p>Уровень ${(S.ex[t.id]||0)+1}</p></div>`).join("")}</div>${back}`}
function say(w){try{const u=new SpeechSynthesisUtterance(w);u.lang="ru-RU";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function spExam(){const lv=(S.ex.sp||0)+1,pool=lv<2?L.slice(0,Math.floor(N*.67)):lv<4?L:L.slice(Math.floor(N*.33));const q=wsh(pool).slice(0,20);let i=0,ok=0,er=[];
const fin=e=>{const p=!e&&ok>=18;if(p){S.ex.sp=lv;xp(60*lv)}else xp(ok*2);er.forEach(w=>{if(!S.m.includes(w))S.m.push(w)});save();res(`<h2 class="${p?"ok":"er"}">${p?"Диктант сдан! Уровень "+lv:e?"Диктант прерван":"Диктант не сдан"}</h2>Верно: ${ok} из ${e?i:20} (нужно 18 из 20)${er.length?`<p>Ошибки: ${er.join(", ")}</p>`:""}<button class="btn" onclick="spExam()">${p?"Следующий уровень":"Пересдать"}</button>`)};
(function s(){if(i>=20)return fin(0);const w=q[i],h=lv==1?w[0]+" "+"· ".repeat(w.length-1):lv==2?"· ".repeat(w.length):"букв: "+w.length;
app.innerHTML=`<div class="card">${STP}<span class="tag">Уровень ${lv}</span> <span class="tag">${i+1}/20</span><div class="big">${h}</div><p class="m" style="text-align:center">Нажмите «Прослушать» (если нет звука — ориентируйтесь на подсказку и значение).${lv<3?"<br><i>"+(MN[w]||"")+"</i>":""}</p><p style="text-align:center"><button class="btn o" id="pl">🔊 Прослушать</button><br><input id="in" style="width:260px" autocomplete="off"> <button class="btn" id="ck">Ответить</button></p></div>`;stp(()=>fin(1));
$("pl").onclick=()=>say(w);say(w);$("in").focus();const c=()=>{const v=$("in").value.trim().toLowerCase();if(v==w)ok++;else er.push(w);i++;s()};$("ck").onclick=c;$("in").onkeydown=e=>{if(e.key=="Enter")c()}})()}
function ach(){app.innerHTML=`<div class="grid">${AC.map(([id,n,d])=>`<div class="card a ${S.a[id]?"on":""}"><b>${S.a[id]?"🏆":"🔒"} ${n}</b><br><span class="m">${d}</span></div>`).join("")}</div><div class="card">Выучено слов: ${learned()} / ${N} · лучший рекорд скорости: ${S.best} · XP: ${S.xp}</div>${back}`}
save();home();
</script></body></html>
